apiVersion: apps/v1
kind: Deployment
metadata:
  name: barricade
  namespace: auth
  labels:
    app: barricade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: barricade
  template:
    metadata:
      name: barricade
      labels:
        app: barricade
    spec:
      containers:
        - name: barricade
          image: ghcr.io/vaynerakawalo/barricade:CD-202605102305-aa0e81d # {"$imagepolicy": "flux-system:barricade-policy"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: barricade-prod-keys
          env:
            - name: ENTITIES_TABLE
              value: barricade-entities-prod
            - name: OPERATIONAL_TABLE
              value: barricade-operational-entities-prod
            - name: DOMAIN
              value: blamedevs.com
      restartPolicy: Always
